<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111411">
  <meta name="description" content="Wierszyki o Michałku">
  <title>Wierszyki o Michałku</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #111411;
      --paper-deep: #181d19;
      --ink: #f0eee6;
      --muted: #9da69b;
      --green: #a9bea2;
      --green-dark: #91a98a;
      --rose: #d79b91;
      --line: #303832;
      --white: #1a201b;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(111, 139, 103, .10), transparent 42rem);
    }

    button { font: inherit; }

    .page-shell {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    .topbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(169, 190, 162, .13);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
      font-family: var(--serif);
      font-size: 19px;
      letter-spacing: -.3px;
    }

    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border: 1px solid #39443a;
      border-radius: 50%;
      color: var(--green);
      font-size: 18px;
    }

    .top-note {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: 390px;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      overflow: hidden;
      padding: 48px 0 42px;
    }

    .hero-copy { position: relative; z-index: 1; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 21px;
      color: var(--green);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 24px;
      height: 1px;
      background: var(--rose);
      content: "";
    }

    h1 {
      max-width: 610px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(45px, 6vw, 72px);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: 1.04;
    }

    h1 em {
      color: var(--green);
      font-weight: 400;
    }

    .hero-description {
      max-width: 425px;
      margin: 19px 0 27px;
      color: #aab1a6;
      font-size: 15px;
      line-height: 1.8;
    }

    .draw-button {
      display: inline-flex;
      min-height: 49px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 21px;
      border: 0;
      border-radius: 999px;
      background: #9eb394;
      color: #172019;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background .2s ease, transform .2s ease;
    }

    .draw-button:hover {
      transform: translateY(-2px);
      background: var(--green-dark);
    }

    .draw-button:focus-visible,
    a:focus-visible {
      outline: 3px solid #bd796e;
      outline-offset: 4px;
    }

    .button-sparkle { font-size: 16px; }

    .hero-art {
      width: min(100%, 405px);
      justify-self: end;
      overflow: visible;
    }

    .collection {
      padding: 31px 0 74px;
      border-top: 1px solid rgba(169, 190, 162, .13);
    }

    .collection-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 23px;
    }

    .section-kicker {
      margin: 0 0 8px;
      color: var(--rose);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(29px, 4vw, 38px);
      font-weight: 400;
      letter-spacing: -.035em;
    }

    .poem-count {
      padding-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .poem-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .poem-card {
      position: relative;
      min-height: 0;
      padding: 27px 26px 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(38, 48, 39, .75), var(--white) 74%);
      transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
      scroll-margin-top: 28px;
    }

    .poem-card::before {
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(194, 210, 184, .08);
      border-radius: 18px;
      content: "";
      pointer-events: none;
    }

    .poem-card.is-drawn {
      transform: translateY(-3px);
      border-color: #71896b;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .24);
    }

    .poem-card.is-drawn::after {
      position: absolute;
      top: 18px;
      right: 20px;
      color: var(--rose);
      content: "✿";
      font-size: 16px;
    }

    .poem-card h3 {
      position: relative;
      margin: 0 0 15px;
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 400;
      letter-spacing: -.025em;
    }

    .poem-lines {
      position: relative;
      margin: 0;
      color: #c0c7bc;
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .site-footer {
      padding: 19px 0 25px;
      border-top: 1px solid rgba(169, 190, 162, .13);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .site-footer span { color: var(--rose); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-width: 760px) {
      .hero {
        min-height: 0;
        grid-template-columns: 1fr .65fr;
        padding: 54px 0 40px;
      }

      .hero-art { width: 115%; margin-right: -15%; }
      .poem-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 540px) {
      .page-shell { width: min(100% - 36px, 420px); }
      .topbar { height: 68px; }
      .top-note { font-size: 9px; }
      .hero { display: block; padding: 36px 0 29px; }
      h1 { font-size: clamp(43px, 12vw, 58px); }
      .hero-description { max-width: 355px; margin: 15px 0 21px; font-size: 14px; line-height: 1.75; }
      .eyebrow { margin-bottom: 16px; }
      .draw-button { width: 100%; min-height: 54px; font-size: 14px; }
      .hero-art {
        position: absolute;
        right: -82px;
        bottom: -16px;
        width: 205px;
        opacity: .13;
        pointer-events: none;
      }
      .hero-copy { max-width: 360px; }
      .collection { padding: 25px 0 45px; }
      .collection-heading { align-items: center; margin-bottom: 17px; }
      .poem-count { max-width: 95px; text-align: right; white-space: normal; }
      .poem-grid { grid-template-columns: 1fr; gap: 13px; }
      .poem-card { min-height: 0; padding: 26px 24px; border-radius: 22px; }
      .poem-card::before { inset: 6px; border-radius: 16px; }
      .poem-card h3 { font-size: 24px; }
      .poem-lines { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Ogród słów — strona główna">
        <span class="brand-mark" aria-hidden="true">❀</span>
        <span>Precz z propagandą Deva</span>
      </a>
      <span class="top-note">MK</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">MK</p>
          <h1 id="page-title">Wierszyki o<br><em>Michałku</em></h1>
          <p class="hero-description">
            Gdy ci smutno, gdy ci źle, wylosuj wierszyk, ulżyj se.
          </p>
          <button class="draw-button" id="draw-poem" type="button">
            <span class="button-sparkle" aria-hidden="true">✳</span>
            Wylosuj wiersz
          </button>
        </div>

        <svg class="hero-art" viewBox="0 0 410 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Delikatna ilustracja kwiatów">
          <path d="M206 303C199 253 203 201 219 152M206 260C176 239 156 215 145 185M211 231C239 208 257 185 265 155M201 280C177 270 161 256 148 235" stroke="#68836C" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M204 261C183 239 165 235 151 239C160 254 178 264 204 261ZM212 237C233 214 252 211 266 215C257 231 239 241 212 237ZM199 282C180 264 162 261 149 265C159 278 176 286 199 282Z" fill="#CBD5BD" stroke="#80947B" stroke-width="1.4"/>
          <path d="M145 185C129 178 110 175 93 178C106 189 125 194 145 185ZM265 155C282 147 300 145 317 149C305 160 286 165 265 155Z" fill="#D9DECB" stroke="#9AA78D" stroke-width="1.4"/>
          <path d="M217 158C203 148 193 135 194 122C209 126 219 139 217 158Z" fill="#DCE2D1"/>
          <path d="M92 178C92 160 99 147 112 139C118 154 111 169 92 178Z" fill="#C5D2BE"/>
          <path d="M318 149C315 132 320 118 332 109C340 124 334 139 318 149Z" fill="#D5DAC7"/>
          <g transform="translate(224 101)">
            <ellipse cx="0" cy="-23" rx="11" ry="19" fill="#D6A29A"/>
            <ellipse cx="0" cy="23" rx="11" ry="19" fill="#D6A29A"/>
            <ellipse cx="-23" cy="0" rx="19" ry="11" fill="#E2B8AD"/>
            <ellipse cx="23" cy="0" rx="19" ry="11" fill="#E2B8AD"/>
            <ellipse cx="-16" cy="-16" rx="11" ry="18" transform="rotate(-45 -16 -16)" fill="#D99D94"/>
            <ellipse cx="16" cy="-16" rx="11" ry="18" transform="rotate(45 16 -16)" fill="#E4BDB2"/>
            <ellipse cx="-16" cy="16" rx="11" ry="18" transform="rotate(45 -16 16)" fill="#E4BDB2"/>
            <ellipse cx="16" cy="16" rx="11" ry="18" transform="rotate(-45 16 16)" fill="#D99D94"/>
            <circle r="8" fill="#C69A60"/>
            <circle r="4" fill="#E8D19F"/>
          </g>
          <g transform="translate(83 135) scale(.67)">
            <ellipse cy="-20" rx="9" ry="16" fill="#E0B8A7"/>
            <ellipse cy="20" rx="9" ry="16" fill="#E0B8A7"/>
            <ellipse cx="-20" rx="16" ry="9" fill="#D49B91"/>
            <ellipse cx="20" rx="16" ry="9" fill="#D49B91"/>
            <ellipse cx="-14" cy="-14" rx="9" ry="15" transform="rotate(-45 -14 -14)" fill="#E4BBAF"/>
            <ellipse cx="14" cy="-14" rx="9" ry="15" transform="rotate(45 14 -14)" fill="#DCA99D"/>
            <ellipse cx="-14" cy="14" rx="9" ry="15" transform="rotate(45 -14 14)" fill="#DCA99D"/>
            <ellipse cx="14" cy="14" rx="9" ry="15" transform="rotate(-45 14 14)" fill="#E4BBAF"/>
            <circle r="7" fill="#C89D63"/>
          </g>
          <g transform="translate(337 99) scale(.6)">
            <ellipse cy="-20" rx="9" ry="16" fill="#D6A29A"/>
            <ellipse cy="20" rx="9" ry="16" fill="#D6A29A"/>
            <ellipse cx="-20" rx="16" ry="9" fill="#E1B7AB"/>
            <ellipse cx="20" rx="16" ry="9" fill="#E1B7AB"/>
            <ellipse cx="-14" cy="-14" rx="9" ry="15" transform="rotate(-45 -14 -14)" fill="#DCA69A"/>
            <ellipse cx="14" cy="-14" rx="9" ry="15" transform="rotate(45 14 -14)" fill="#E5C0B4"/>
            <ellipse cx="-14" cy="14" rx="9" ry="15" transform="rotate(45 -14 14)" fill="#E5C0B4"/>
            <ellipse cx="14" cy="14" rx="9" ry="15" transform="rotate(-45 14 14)" fill="#DCA69A"/>
            <circle r="7" fill="#C89D63"/>
          </g>
          <circle cx="291" cy="70" r="2" fill="#BE8D6F"/>
          <circle cx="113" cy="99" r="2" fill="#BE8D6F"/>
          <circle cx="291" cy="70" r="7" stroke="#D8C6A7"/>
          <circle cx="113" cy="99" r="6" stroke="#D8C6A7"/>
          <path d="M177 304H246" stroke="#ABB59F" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </section>

      <section class="collection" id="wiersze" aria-labelledby="collection-title">
        <div class="collection-heading">
          <div>
            <p class="section-kicker">Don't be nonchalant</p>
            <h2 id="collection-title">STAY FREAKY BITCH</h2>
          </div>
          <span class="poem-count" id="poem-count"></span>
        </div>
        <div class="poem-grid" id="poem-grid"></div>
        <p class="sr-only" id="draw-announcement" aria-live="polite"></p>
      </section>
    </main>

    <footer class="site-footer">
      M <span>✿</span> K
    </footer>
  </div>

  <script>
    // Dodaj nowy obiekt, aby wiersz pojawił się w ogrodzie.
    // W polu "tekst" oddzielaj kolejne linijki znakiem nowej linii (\n).
    const wiersze = [
      {
        tytul: "Poranesk",
        tekst: "Michał Michał, ciągnie baty,\ngdy na krypto bierze raty,\nna półce gumowe stoją gnaty,\njego kutas jest kudłaty.\n \n Michał Michał, jesteś spoko,\ngdy koledze liżesz czoko,\nszacun deva ponad wszystko,\nMaja odpuść sobie myszko."
      },
      {
        tytul: "Małe rzeczy",
        tekst: "Ciepła herbata, oddech i cisza,\nplama słońca na brzegu stołu.\nCzasem szczęście nie mówi głośno —\nsiada obok. I już jest w domu."
      },
      {
        tytul: "Na później",
        tekst: "Nie musisz dzisiaj znać odpowiedzi,\nani mieć mapy na każdy czas.\nNiech myśl odpocznie, gdzieś przy oknie,\njutro odnajdzie właściwy szlak."
      },
      {
        tytul: "Dziki ogród",
        tekst: "Kwiat nie pyta, czy wolno mu kwitnąć,\nwiatr nie czeka na dobry znak.\nRośnij po swojemu, jasna duszo,\nświat ma miejsce na właśnie taki kształt."
      },
      {
        tytul: "Dobre słowo",
        tekst: "Jedno dobre słowo — mały kamyk,\nwrzucony w codzienności nurt.\nKręgi płyną dalej, dalej, ciszej,\naż rozjaśnią komuś cały dzień."
      },
      {
        tytul: "Powrót światła",
        tekst: "Nawet za najdłuższą chmurą\nniebo trzyma jasny brzeg.\nDaj nadziei chwilę miejsca —\nona dobrze wie, gdzie jest."
      }
    ];

    const poemGrid = document.getElementById("poem-grid");
    const announcement = document.getElementById("draw-announcement");
    const count = document.getElementById("poem-count");
    let previousDraw = -1;

    function podpisLiczby(number) {
      const lastTwo = number % 100;
      const lastDigit = number % 10;

      if (number === 1) return "wiersz";
      if (lastTwo >= 12 && lastTwo <= 14) return "wierszy";
      if (lastDigit >= 2 && lastDigit <= 4) return "wiersze";
      return "wierszy";
    }

    function pokazWiersze() {
      poemGrid.replaceChildren();

      wiersze.forEach(function (wiersz, index) {
        const card = document.createElement("article");
        card.className = "poem-card";
        card.id = "wiersz-" + index;

        const title = document.createElement("h3");
        title.textContent = wiersz.tytul;

        const lines = document.createElement("p");
        lines.className = "poem-lines";
        lines.textContent = wiersz.tekst;

        card.append(title, lines);
        poemGrid.append(card);
      });

      count.textContent = wiersze.length + " " + podpisLiczby(wiersze.length);
    }

    document.getElementById("draw-poem").addEventListener("click", function () {
      if (wiersze.length === 0) {
        announcement.textContent = "Ogród czeka na pierwszy wiersz.";
        return;
      }

      let chosen = Math.floor(Math.random() * wiersze.length);
      if (wiersze.length > 1 && chosen === previousDraw) {
        chosen = (chosen + 1 + Math.floor(Math.random() * (wiersze.length - 1))) % wiersze.length;
      }
      previousDraw = chosen;

      document.querySelectorAll(".poem-card.is-drawn").forEach(function (card) {
        card.classList.remove("is-drawn");
      });

      const selectedCard = document.getElementById("wiersz-" + chosen);
      selectedCard.classList.add("is-drawn");
      selectedCard.scrollIntoView({ behavior: "smooth", block: "center" });
      announcement.textContent = "Wylosowany wiersz: " + wiersze[chosen].tytul;
    });

    pokazWiersze();
  </script>
</body>
</html>
